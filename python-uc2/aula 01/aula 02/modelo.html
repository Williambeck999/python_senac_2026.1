<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Pagina HTML 5</title>
     
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
    rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        header {
            border-color: black;
            border-width: 1px;
            border-style: solid;
            padding-top: 20px;
            padding-bottom: 20px;
        } 
            main {
            border-color: aquamarine;
            border-width: 1px;
            border-style: dotted;
            padding-top: 20px;
            padding-bottom: 20px;
        
        }
            footer {
            border-color: blueviolet;
            border-width: 1px;
            border-style: dashed;
            padding-top: 20px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <!--Inicio da header-->
    <header class = "container">

    </header>
    <!--fim da header-->

    <!--inicio da main-->
    <main class ="container-fluid">
        <section id="section1" class ="mb-5">
            <h2 class="text-primary">
                <i class="fas fa-lightbuld icon"></i>
                SEÇÃO 1 : Front Awesome 
            </h2>

            <article class="card mb-3"> 
                <div class="card-body">
                    <h3 class="card-title text-warning">
                        <i class="fas fa-pencil-alt icon"></i>
                        exemplos
                    </h3>
                    <ul>
                        <li><i class="fas fa-info-circle icon"></i></li>
                        <li><i class="fas fa-book icon"></i></li>
                         <li><i class="fas fa-arrow-dwon icon"></i></li>
                    </ul>
                </div>
            </article>
        </section>

        <section id="section2" class = "mb-5">
        </section>
            
    </main>
    <!--fim da main-->

    <!--inico do footer-->
    <footer id="footer" class = "container text-center">
        <p class = "text-muted">
        <i class = "far fa-copyright icon"></i>
        2023 - todos os direitos reservados
        </p>
    </footer>
    <!--fim da footer-->    
    
    <!-- Bootstrap JS e dependencias -->
    <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>
    
</body>
</html>
