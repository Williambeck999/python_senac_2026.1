<body class= "bg-secundary">
<!-- DIV PRINCIPAL AREA DO SITE -->
<div id ="div_principal" class="container adicionar_borda bg-light">
<!--
    header da pagina
    logotipo
    titulo
    menu principla
    login logaout
    criar conta -->
<header class="adicionar_borda">
<div class ="row">
    <div class = "col-12">
        logo / Titulo
    </div>
</div>

<div class="row">
    <div class="col-9">
        Menu Principal 
    </div>
    <div class="col-3">
     login/logout 
     cadastrar   
    </div>
</div>
</header>


<main class="adicionar_borda">
    <!--formulario de cadastro-->
    <form action="cadastro/" method="get" target="_blank">
        <!--nome completo-->
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome"
             required placeholder = "seu nome completo"
             title="informe o seu nome completo (campo obrigatório)">

        <!--e-mail de login-->
        <label for="email">email:</label>
            <input type="email" id="email" name="email"
             required placeholder = "seu email"
             title="informe o seu email (campo obrigatório)">


        <!--senha-->
        <label for="senha">senha:</label>
            <input type="password" id="senha" name="senha"
            required minlength="6"
             required placeholder = "sua senha"
             title="informe sua senha (campo obrigatório)">

        <!--confirmar senha-->
        <label for="confirme sua senha">confirmar:</label>
            <input type="password" id="comfirme sua senha" name="confirme sua senha"
            required minlength="8"
             required placeholder = "sua senha"
             title="confirme sua senha (campo obrigatório)">

        <!--CPF-->
        <label for="CPF">CPF:</label>
            <input type="text" id="CPF" name="CPF"
             placeholder = "000.000.000-00"
             pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
             required placeholder = "seu CPF"
             title="Formato">

        <!--CEP-->
        <label for="CEP">CEP:</label>
            <input type="text" id="CEP" name="CEP"
             required placeholder = "seu CEP"
             placeholder="00000-000"
             pattern="\d{5}-\d{3}"
             title="informe o seu CEP(campo obrigatório)">

        <!--logradouro-->
        <label for="logradouro">logradouro:</label>
            <input type="text" id="logradouro" name="logradouro"
             required placeholder = "sua região"
             title="informe sua região (campo obrigatório)">

        <!--complemento-->
        <label for="complemento">complemento:</label>
            <input type="text" id="complemento" name="complemento"
             required placeholder = "complemento"
             title="informaçoes adicionais (campo obrigatório)">

        <!--bairro-->
        <label for="bairro">bairro:</label>
            <input type="text" id="bairro" name="bairro"
             required placeholder = "seu bairro"
             title="informe o seu bairro (campo obrigatório)">

        <!--cidade-->
        <label for="cidade">cidade:</label>
            <input type="text" id="cidade" name="cidade"
             required placeholder = "seu email"
             title="informe o seu estado (campo obrigatório)">

        <!--estado-->
            <label for="estado">estado:</label>
            <input type="text" id="estado" name="estado"
             required placeholder = "seu estado"
             title="informe o seu estado (campo obrigatório)">

        <!--botões-->
             <button type="submit">enviar</button>
             <button type="reset">Limpar</button>
    </form>
    <!--Final do form-->

</main>
